[project]
name = "deception_detection"
version = "0.0.1"
description = "The Geometry of Lies: knowledge and persona directions for detecting deception in LLMs"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "torch",
    "pydantic~=2.0",
    "wandb~=0.18.1",
    "fire~=0.5.0",
    "tqdm~=4.66.2",
    "pytest~=8.2.0",
    "ipykernel~=6.29.0",
    "matplotlib~=3.9.2",
    "jaxtyping~=0.2.29",
    "transformers>=4.45.2",
    "tokenizers>=0.20.1", # includes bugfix for Llama tokenizer
    "pandas~=2.2.2",
    "einops~=0.7.0",
    "numpy~=1.26.4",
    "plotly",
    "anthropic",
    "datasets~=2.20.0",
    "scikit-learn",
    "python-dotenv",
    "circuitsvis",
    "accelerate",
    "tabulate",
    "seaborn",
    "peft",
    "inspect-ai>=0.3.41",
    "together>=1.3.1",
    "openai",
    "goodfire",
    "streamlit",
    "huggingface-hub>=0.33.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pyright>=1.1.348",
    "pre-commit~=3.6.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["deception_detection*", "experiments*", "extensions*"]

[tool.ruff]
line-length = 100
fix = true
exclude = ["data/", "third_party/", "persona_bank/", "paper/"]
# for jaxtyping, see XXXX

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = ["F722", "E712"] 

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true

[tool.ruff.lint.isort]
known-third-party = ["wandb"]

[tool.pyright]
include = ["deception_detection", "experiments", "extensions", "tests"]
exclude = ["data/**", "third_party/**", "persona_bank/**", "paper/**"]
typeCheckingMode = "strict"

reportPrivateImportUsage = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportMissingTypeStubs = false
reportUntypedFunctionDecorator = false


[tool.pytest.ini_options]
filterwarnings = [
    'ignore:Type google._upb._message',
    'ignore:open_text is deprecated',
]
